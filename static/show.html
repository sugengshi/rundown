<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .clocks{display:flex;align-items:stretch;flex:1;min-width:0;flex-wrap:wrap}
  .clock{padding:10px 18px;border-right:1px solid var(--rule);min-width:118px}
  .clock .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.15}
  .clock.hero{min-width:190px}
  .clock.hero .val{font-size:40px}
  .val.over{color:var(--live)} .val.under{color:var(--ok)} .val.warn{color:var(--next)}
  .transport{display:flex;align-items:center;gap:8px;padding:10px 16px;margin-left:auto}
  .showname{padding:0 18px;display:flex;align-items:center;font-family:var(--display);font-size:15px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--rule)}

  .shelf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 16px}
  .tin{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;
    font-family:var(--mono);width:92px;text-align:center;font-size:13px}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}

  .sharebox{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--rule);
    border-radius:4px;padding:8px 10px;margin-bottom:16px;flex-wrap:wrap}
  .sharebox input{flex:1;min-width:220px;background:transparent;border:0;font-family:var(--mono);font-size:12px;color:var(--focus)}

  /* minmax(0,...) rather than a bare 1fr — a plain 1fr track can't shrink
     past the natural min-content width of what's inside it (an <input>
     has a non-trivial one), so the grid quietly overflows its container
     once the window's narrower than that. This is what was blowing the
     page out sideways with no way to scroll back to the missing part. */
  .rowsWrap{overflow-x:auto}
  .head,.row{display:grid;grid-template-columns:14px 34px 78px 78px minmax(0,1fr) 150px 118px;align-items:stretch;min-width:0}
  .head{border-bottom:1px solid var(--rule);font-family:var(--display);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .head>div{padding:8px 10px}
  .rows{border-bottom:1px solid var(--rule)}
  .row{border-bottom:1px solid rgba(38,62,73,.55);transition:background .12s ease}
  .row:hover{background:rgba(28,47,56,.5)}
  .row.done{color:var(--done)}
  .row.done .cell input,.row.done .cell textarea{color:var(--done)}
  .row.live{background:rgba(255,68,56,.09)}
  .row.next{background:rgba(255,194,75,.06)}
  .tally{background:#0B1418;border-right:1px solid var(--rule)}
  .row.live .tally{background:var(--live);box-shadow:0 0 14px rgba(255,68,56,.55)}
  .row.next .tally{background:var(--next)}
  .row.done .tally{background:var(--done)}
  .cell{padding:7px 10px;display:flex;align-items:center;min-width:0}
  .cell.num{font-family:var(--mono);font-size:12px;color:var(--muted);justify-content:flex-end}
  .cell input,.cell textarea{width:100%;background:transparent;border:1px solid transparent;border-radius:3px;
    padding:4px 6px;font-size:14px;resize:none}
  .cell input:hover,.cell textarea:hover{border-color:var(--rule)}
  .cell input:focus,.cell textarea:focus{border-color:var(--focus);background:var(--panel)}
  .cell .start{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .cell input.dur{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
  .cell input.title{font-weight:500}
  .cell.who input{color:var(--muted);font-size:13px}
  .cell.tools{gap:4px;justify-content:flex-end}
  .icon{background:transparent;border:1px solid transparent;border-radius:3px;width:26px;height:26px;
    color:var(--muted);font-size:13px;display:grid;place-items:center}
  .icon:hover{border-color:var(--rule);color:var(--text)}
  .icon.golive:hover{color:var(--live);border-color:var(--live)}
  .row.heading{grid-template-columns:14px minmax(0,1fr) 118px;background:var(--panel)}
  .row.heading .cell input{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--next)}
  .notes{grid-column:5/7;padding-top:0}
  .notes textarea{color:var(--muted);font-size:13px;min-height:22px}
  .addbar{display:flex;gap:8px;padding:14px 0}

  /* A day break: resets the running clock to a specific date + time instead
     of continuing from the previous cue's duration — see dayEpoch(). Styled
     like a heading but bolder, since it's a bigger structural moment, and
     carries its own date/time inputs instead of none. */
  .row.day{grid-template-columns:14px minmax(0,1fr) 210px 118px;background:var(--live);background:rgba(255,68,56,.10);
    border-top:2px solid var(--live);border-bottom:2px solid var(--live)}
  .row.day .cell input.f-title{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--live)}
  .daytime{display:flex;gap:6px;align-items:center}
  .daytime input[type=date]{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:6px 8px;font-family:var(--mono);font-size:12px;color:var(--text);color-scheme:dark}

  body.viewer .shelf,body.viewer .addbar,body.viewer .transport,
  body.viewer .cell.tools,body.viewer .sharebox{display:none}
  body.viewer .cell input,body.viewer .cell textarea{pointer-events:none;border-color:transparent!important}

  /* Driver: transport (top Go/Stop, and each row's ▶) stays live. Content
     editing — the shelf, add-row bar, per-row reorder/duplicate/delete, the
     link-sharing box — is inert, same as a viewer. Enforced again
     server-side regardless of what this CSS hides; see set_live() in
     app/main.py. */
  body.driver .shelf,body.driver .addbar,body.driver .sharebox{display:none}
  body.driver .cell input,body.driver .cell textarea{pointer-events:none;border-color:transparent!important}
  body.driver .cell.tools .icon:not(.golive){display:none}

  body:not(.viewer):not(.driver) .showname{display:none}
  @media (max-width:820px){
    .head{display:none}
    .row,.row.heading{grid-template-columns:10px minmax(0,1fr) 100px}
    .row.day{grid-template-columns:10px minmax(0,1fr) 100px}
    .daytime{display:none}
    .cell.num,.cell.start,.cell.who{display:none}
    .notes{grid-column:2/4}
  }
</style>

<div class="banner" id="banner"></div>

<div class="topbar">
  <a class="brand" href="/"><span class="dot" id="tallyDot"></span><h1>Rundown</h1></a>
  <div class="showname" id="showName"></div>
  <div class="clocks">
    <div class="clock hero"><div class="lab">Cue remaining</div><div class="val" id="cRemain">—</div></div>
    <div class="clock"><div class="lab">On now</div><div class="val" id="cNow" style="font-size:16px;font-family:var(--body);font-weight:500">Standby</div></div>
    <div class="clock"><div class="lab">Drift</div><div class="val" id="cDrift">00:00</div></div>
    <div class="clock"><div class="lab">Show left</div><div class="val" id="cLeft">—</div></div>
    <div class="clock"><div class="lab">Time of day</div><div class="val" id="cWall">—</div></div>
  </div>
  <div class="transport">
    <button class="btn go" id="btnGo">Go</button>
    <button class="btn stop" id="btnStop">Stop</button>
  </div>
</div>

<div class="wrap">
  <div class="shelf">
    <a class="btn ghost" id="lnkStudio" href="/studio">← All rundowns</a>
    <button class="btn ghost" id="btnRename">Rename</button>
    <span style="flex:1"></span>
    <label class="lab" for="inStart">Show starts</label>
    <input class="tin" id="inStart" value="10:00">
    <label class="toggle"><input type="checkbox" id="chkNotes"> Show notes to viewers</label>
    <button class="btn ghost" id="btnCsv">Export CSV</button>
  </div>

  <div class="sharebox">
    <span class="lab">Viewer link</span>
    <input id="shareUrl" readonly>
    <button class="btn" id="btnCopy">Copy</button>
    <span class="lab" id="viewerCount">0 watching</span>
  </div>

  <div class="sharebox">
    <span class="lab">Driver link</span>
    <input id="driveUrl" readonly>
    <button class="btn" id="btnCopyDrive">Copy</button>
    <span class="lab">Can go/skip/stop cues — can't edit content</span>
  </div>

  <div class="rowsWrap">
    <div class="head"><div></div><div>#</div><div>Start</div><div>Length</div><div>Segment</div><div>Who</div><div></div></div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="addbar">
    <button class="btn" id="btnAddCue">Add segment</button>
    <button class="btn ghost" id="btnAddHead">Add section header</button>
    <button class="btn ghost" id="btnAddDay">Add day</button>
  </div>

  <div class="foot" id="foot">
    <span><kbd>Space</kbd> go to next cue</span>
    <span><kbd>Esc</kbd> stop the clock</span>
    <span>Lengths accept <code>5</code>, <code>5:30</code>, or <code>1:05:00</code></span>
    <span id="state">—</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const SHOW_ID = location.pathname.split("/").filter(Boolean).pop();
const K  = params.get("k") || "";
const OP = params.get("o") || "";
const D  = params.get("d") || ""; // driver link: can advance/stop cues, can't edit content
const auth = () => [
  K  && "k=" + encodeURIComponent(K),
  OP && "o=" + encodeURIComponent(OP),
  D  && "d=" + encodeURIComponent(D),
].filter(Boolean).join("&");

let doc = null, name = "", canEdit = false, canDrive = false;
// Cue start times are stamped with the operator's clock. Viewers count down
// against their own. A device whose clock is minutes off will show minutes of
// error — see "Known limits" in the README.
let serverSkew = 0;
let saveTimer = null, ws = null, applyingRemote = false, dirty = false;

const now = () => Date.now() + serverSkew;
const rid = () => Math.random().toString(36).slice(2,10);
const esc  = s => String(s ?? "").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const escA = s => esc(s).replace(/"/g,"&quot;");
function banner(msg, kind){ const b=$("banner"); b.textContent=msg; b.className="banner "+kind; }
function state(msg){ $("state").textContent = msg; }

/* ---------- time ---------- */
function parseDur(str){
  str = String(str).trim(); if(!str) return 0;
  if(str.includes(":")){
    const p = str.split(":").map(n=>parseInt(n,10)||0);
    return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];
  }
  const n = parseFloat(str); return isNaN(n)?0:Math.round(n*60);
}
function fmtDur(sec){
  const neg = sec<0; sec = Math.abs(Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60, pad=n=>String(n).padStart(2,"0");
  return (neg?"−":"") + (h ? h+":"+pad(m)+":"+pad(s) : pad(m)+":"+pad(s));
}
const parseClock = s => { const p=String(s||"0").split(":").map(n=>parseInt(n,10)||0); return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0); };

// Cue start times used to be "seconds since midnight", re-interpreted against
// whichever device happened to be looking at the page. That's the timezone
// bug: a remote viewer's midnight isn't the operator's midnight, so the same
// number meant a different clock time depending who read it — and a show
// running past midnight wrapped back to 00:00 and went nonsensical.
//
// Fix: doc.startEpoch is an absolute instant (ms since the Unix epoch) set
// once, from the operator's own clock, when they set or change "Show
// starts". Every planned start is that instant plus the sum of the cue
// durations before it — durations are just seconds, so this is immune to
// timezones and rolls cleanly past midnight with no wraparound. doc.tz (an
// IANA zone name, e.g. "Asia/Singapore") is carried along purely so every
// viewer's browser can *display* that instant as the same wall-clock time
// the operator sees, regardless of where the viewer's device thinks it is.
function fmtClock(epochMs){
  try{
    return new Intl.DateTimeFormat("en-GB",
      { hour:"2-digit", minute:"2-digit", hour12:false, timeZone: doc && doc.tz || undefined }
    ).format(epochMs);
  }catch(e){
    // Unknown/garbled zone name — fall back to the viewing device's own
    // clock rather than failing to render at all.
    const d = new Date(epochMs), pad=n=>String(n).padStart(2,"0");
    return pad(d.getHours())+":"+pad(d.getMinutes());
  }
}
// A "day" item is a checkpoint that resets the running clock to a specific
// date + time rather than continuing from the previous item's duration —
// what makes a single multi-day rundown possible instead of one rundown per
// day. It carries its own date ("YYYY-MM-DD") and time ("HH:MM"), read in
// whatever device is editing it — same one-timezone assumption the rest of
// the show already makes, just applied per day instead of once.
function dayEpoch(it, fallback){
  const parts = String(it.date||"").split("-").map(n=>parseInt(n,10));
  if(parts.length!==3 || parts.some(isNaN)) return fallback;
  const dt = new Date(parts[0], parts[1]-1, parts[2], 0, 0, 0, 0);
  return dt.getTime() + parseClock(it.time||"09:00")*1000;
}
function plannedStarts(d){
  let t = d.startEpoch, out=[];
  for(const it of d.items){
    if(it.type==="day") t = dayEpoch(it, t);
    out.push(t);
    if(it.type==="cue") t += (it.dur||0)*1000;
  }
  return out;
}
// Which slice of doc.items counts as "today" right now, for the Show-left
// clock. With no day breaks this is the whole rundown, unchanged from
// before. With day breaks, it's the segment between whichever day-break's
// start has most recently passed and the next one (or the very first
// segment, if we're before the first day-break's start).
function currentDaySegment(){
  const starts = plannedStarts(doc);
  const days = [];
  doc.items.forEach((it,i)=>{ if(it.type==="day") days.push({idx:i, epoch:starts[i]}); });
  if(!days.length) return [0, doc.items.length];
  let active = null;
  for(const dd of days) if(dd.epoch <= now()) active = dd;
  if(!active) return [0, days[0].idx];
  const nxt = days.find(dd => dd.idx > active.idx);
  return [active.idx+1, nxt ? nxt.idx : doc.items.length];
}
// Anchors doc.start ("HH:MM", still the editable field) to a real instant:
// today, in whichever timezone the operator's own device is in, at that
// clock time. Returns true if it had to fill in a missing anchor (i.e. this
// rundown predates the fix, or was just created) so the caller knows whether
// there's something new worth persisting.
function setStartEpoch(clockStr){
  const base = new Date(now());
  base.setHours(0,0,0,0);
  doc.startEpoch = base.getTime() + parseClock(clockStr)*1000;
  doc.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
}
function ensureStart(){
  if(doc.startEpoch) return false;
  setStartEpoch(doc.start || "10:00");
  return true;
}

/* ---------- network ---------- */
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){
    let msg = "Server said " + r.status;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

async function loadShow(){
  const d = await api(`/api/rundowns/${SHOW_ID}?${auth()}`);
  doc = d.data; name = d.name; canEdit = d.canEdit; canDrive = !!d.canDrive;
  doc.items = doc.items || [];
  const migrated = ensureStart();
  // Three tiers now, not two: full editor, drive-only (can advance/stop
  // cues, can't touch content), or plain read-only viewer. CSS keys off
  // these two body classes — see the .driver/.viewer rules above.
  if(!canEdit && !canDrive) document.body.classList.add("viewer");
  else if(!canEdit && canDrive) document.body.classList.add("driver");
  $("showName").textContent = name;
  document.title = name + " — Rundown";
  if(canEdit){
    $("shareUrl").value = location.origin + "/r/" + SHOW_ID;
    if(d.driveKey) $("driveUrl").value = location.origin + "/r/" + SHOW_ID + "?d=" + encodeURIComponent(d.driveKey);
    $("chkNotes").checked = !!doc.shareNotes;
    $("lnkStudio").href = OP ? "/studio?o=" + encodeURIComponent(OP) : "/studio";
    $("inStart").value = doc.start || "10:00";
  }
  if(!canEdit && canDrive){
    // Say plainly what this link can and can't do, so a driver doesn't go
    // hunting for edit controls that were never theirs.
    $("foot").innerHTML = `<span><kbd>Space</kbd> go to next cue</span>
      <span><kbd>Esc</kbd> stop the clock</span>
      <span>You're driving this rundown — the running order is set by the operator.</span>
      <span id="state">—</span>`;
  }
  render();
  // Only the operator's clock is trustworthy for anchoring the show's start
  // time (see setStartEpoch). If this rundown predates the timezone fix and
  // we just filled in that anchor, persist it so viewers stop computing it
  // themselves off their own device's midnight.
  if(canEdit && migrated) save(true);
  state("Loaded");
}

function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${SHOW_ID}`);
  ws.onopen = () => { $("tallyDot").title = "Connected"; state("Connected"); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type === "update" && !canEdit){
      applyingRemote = true;
      doc = m.data; doc.items = doc.items || [];
      ensureStart(); // display-only fallback if this arrived from a pre-fix save
      name = m.name; $("showName").textContent = name;
      render();
      applyingRemote = false;
      state("Updated " + new Date().toLocaleTimeString());
    }
    if(m.type === "live" && doc){
      // Cue changes now travel over this narrow channel instead of the full
      // "update" broadcast (see saveLive()) — and unlike "update", this is
      // applied for EVERYONE, including the operator's own browser. That's
      // new on purpose: before driver links existed, only the operator ever
      // changed doc.live, so the operator's tab could safely ignore
      // broadcasts and trust its own local state. Now a driver on another
      // device can move the cue too, and the operator needs to see that.
      doc.live = m.live;
      render();
    }
    if(m.type === "viewers") $("viewerCount").textContent = m.viewers + " watching";
    if(m.type === "archived") banner("This rundown has been archived by the operator.", "warn");
    if(m.type === "deleted")  banner("This rundown has been deleted.", "bad");
  };
  ws.onclose = () => {
    state("Reconnecting…");
    if(!canEdit) banner("Connection lost — the times below may be out of date.", "warn");
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {};
  setInterval(() => { if(ws && ws.readyState === 1) ws.send("ping"); }, 25000);
}

function save(immediate){
  if(!canEdit || applyingRemote) return;
  dirty = true;
  clearTimeout(saveTimer);
  const send = async () => {
    try{
      await api(`/api/rundowns/${SHOW_ID}?${auth()}`, {
        method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ name, data: doc })
      });
      dirty = false;
      state("Saved " + new Date().toLocaleTimeString());
      banner("", "");
    }catch(e){
      state("Not saved");
      banner("Could not save: " + e.message, "bad");
    }
  };
  if(immediate) send(); else saveTimer = setTimeout(send, 500);
}
// Separate from save(): transport actions (go/skip/stop) hit their own
// narrow endpoint that can only ever change doc.live, never content — this
// is what a drive-only key is authorised to call. Editors use it too now
// instead of round-tripping the whole document just to change which cue is
// live, which is a smaller, safer write either way.
async function saveLive(){
  if(!canEdit && !canDrive) return;
  try{
    await api(`/api/rundowns/${SHOW_ID}/live?${auth()}`, {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ live: doc.live })
    });
    state(doc.live ? "Live" : "Stopped");
    banner("", "");
  }catch(e){
    state("Not saved");
    banner("Could not update: " + e.message, "bad");
  }
}
window.addEventListener("beforeunload", e => {
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});

/* ---------- render ---------- */
function render(){
  if(!doc) return;
  const rows = $("rows");
  if(!doc.items.length){
    rows.innerHTML = `<div class="empty">Nothing in this rundown yet.</div>`;
    tick(); return;
  }
  const starts = plannedStarts(doc);
  const liveIdx = doc.live ? doc.items.findIndex(i => i.id === doc.live.itemId) : -1;
  let n = 0;
  rows.innerHTML = doc.items.map((it,i) => {
    if(it.type === "heading"){
      return `<div class="row heading" data-i="${i}"><div class="tally"></div>
        <div class="cell"><input class="f-title" value="${escA(it.title||"")}" placeholder="Section name" aria-label="Section name"></div>
        <div class="cell tools">${tools(i, doc.items.length, false)}</div></div>`;
    }
    if(it.type === "day"){
      return `<div class="row day" data-i="${i}"><div class="tally"></div>
        <div class="cell"><input class="f-title" value="${escA(it.title||"")}" placeholder="Day label" aria-label="Day label"></div>
        <div class="cell daytime">
          <input type="date" class="f-day-date" value="${escA(it.date||"")}" aria-label="Date">
          <input class="tin f-day-time" value="${escA(it.time||"09:00")}" aria-label="Start time">
        </div>
        <div class="cell tools">${tools(i, doc.items.length, false)}</div></div>`;
    }
    n++;
    const cls = i===liveIdx ? "live"
      : (liveIdx>=0 && i<liveIdx) ? "done"
      : (liveIdx>=0 && nextCue(liveIdx)===i) ? "next" : "";
    const notesCell = ("notes" in it)
      ? `<div class="cell notes"><textarea class="f-notes" rows="1" placeholder="Notes" aria-label="Notes">${esc(it.notes||"")}</textarea></div>` : "";
    return `<div class="row ${cls}" data-i="${i}"><div class="tally"></div>
      <div class="cell num">${n}</div>
      <div class="cell"><span class="start">${fmtClock(starts[i])}</span></div>
      <div class="cell"><input class="dur f-dur" value="${fmtDur(it.dur||0)}" aria-label="Length"></div>
      <div class="cell"><input class="title f-title" value="${escA(it.title||"")}" placeholder="Segment name" aria-label="Segment name"></div>
      <div class="cell who"><input class="f-who" value="${escA(it.who||"")}" placeholder="Who" aria-label="Who"></div>
      <div class="cell tools">${tools(i, doc.items.length, true)}</div>
      ${notesCell}</div>`;
  }).join("");
  rows.querySelectorAll("textarea").forEach(grow);
  if(!canEdit && liveIdx >= 0){
    const el = rows.querySelector(`.row[data-i="${liveIdx}"]`);
    if(el) el.scrollIntoView({ block:"center", behavior:"smooth" });
  }
  tick();
}
function nextCue(from){ for(let i=from+1;i<doc.items.length;i++) if(doc.items[i].type==="cue") return i; return -1; }
function tools(i, len, isCue){
  return `${isCue?`<button class="icon golive" data-act="go" title="Take this cue live">▶</button>`:""}
    <button class="icon" data-act="up" title="Move up" ${i===0?"disabled":""}>↑</button>
    <button class="icon" data-act="down" title="Move down" ${i===len-1?"disabled":""}>↓</button>
    <button class="icon" data-act="dup" title="Duplicate">⧉</button>
    <button class="icon" data-act="del" title="Delete">✕</button>`;
}
function grow(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }

/* ---------- clock ---------- */
function tick(){
  if(!doc) return;
  const d = new Date(now());
  const pad = n => String(n).padStart(2,"0");
  $("cWall").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const dot=$("tallyDot"), remainEl=$("cRemain"), nowEl=$("cNow"), driftEl=$("cDrift"), leftEl=$("cLeft");

  if(!doc.live){
    dot.style.background="var(--done)"; dot.style.boxShadow="none";
    remainEl.textContent="—"; remainEl.className="val";
    nowEl.textContent="Standby";
    driftEl.textContent="00:00"; driftEl.className="val";
    // Scoped to today's segment, not the whole multi-day rundown — otherwise
    // "Show left" on day 1 would include day 3's cues too.
    const [segStart, segEnd] = currentDaySegment();
    let total = 0;
    for(let i=segStart;i<segEnd;i++) if(doc.items[i].type==="cue") total += doc.items[i].dur||0;
    leftEl.textContent = fmtDur(total);
    return;
  }
  dot.style.background="var(--live)"; dot.style.boxShadow="0 0 10px var(--live)";
  const idx = doc.items.findIndex(i => i.id === doc.live.itemId);
  if(idx < 0) return;
  const it = doc.items[idx];
  const elapsed = (now() - doc.live.startedAt) / 1000;
  const remain = (it.dur||0) - elapsed;

  remainEl.textContent = fmtDur(remain);
  remainEl.className = "val " + (remain<0 ? "over" : remain<60 ? "warn" : "");
  nowEl.textContent = it.title || "Untitled segment";

  const plannedEpoch = plannedStarts(doc)[idx];
  const drift = (doc.live.startedAt - plannedEpoch)/1000 + Math.max(0, elapsed - (it.dur||0));
  driftEl.textContent = (drift>=0?"+":"") + fmtDur(drift);
  driftEl.className = "val " + (drift>30?"over":drift<-30?"under":"");

  // Same day-segment scoping while live: don't count tomorrow's cues as
  // "left" in today's show.
  const [, segEnd] = currentDaySegment();
  let left = Math.max(0, remain);
  for(let i=idx+1;i<segEnd;i++) if(doc.items[i].type==="cue") left += (doc.items[i].dur||0);
  leftEl.textContent = fmtDur(left);
}
setInterval(tick, 250);

/* ---------- transport (editor or driver) ---------- */
function goToIndex(i){
  if((!canEdit && !canDrive) || !doc || i<0 || i>=doc.items.length || doc.items[i].type!=="cue") return;
  doc.live = { itemId: doc.items[i].id, startedAt: now() };
  saveLive(); render();
  const row = document.querySelector(`.row[data-i="${i}"]`);
  if(row) row.scrollIntoView({ block:"center", behavior:"smooth" });
}
function goNext(){
  if((!canEdit && !canDrive) || !doc) return;
  if(!doc.live) return goToIndex(doc.items.findIndex(i => i.type === "cue"));
  const idx = doc.items.findIndex(i => i.id === doc.live.itemId);
  const nx = nextCue(idx);
  if(nx >= 0) goToIndex(nx); else stopShow();
}
function stopShow(){
  if((!canEdit && !canDrive) || !doc) return;
  doc.live = null; saveLive(); render();
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const i = +b.closest(".row").dataset.i, a = b.dataset.act;
  // Taking a cue live is the one row action a driver (not just an editor)
  // is allowed to do — everything else below is content editing.
  if(a==="go"){ if(canEdit || canDrive) goToIndex(i); return; }
  if(!canEdit) return;
  if(a==="up" && i>0) [doc.items[i-1],doc.items[i]]=[doc.items[i],doc.items[i-1]];
  if(a==="down" && i<doc.items.length-1) [doc.items[i+1],doc.items[i]]=[doc.items[i],doc.items[i+1]];
  if(a==="dup") doc.items.splice(i+1,0,{...doc.items[i], id:rid()});
  if(a==="del"){ if(doc.live && doc.live.itemId===doc.items[i].id) doc.live=null; doc.items.splice(i,1); }
  save(); render();
});
$("rows").addEventListener("input", e => {
  if(!canEdit) return;
  const row = e.target.closest(".row"); if(!row) return;
  const it = doc.items[+row.dataset.i];
  if(e.target.classList.contains("f-title")) it.title = e.target.value;
  if(e.target.classList.contains("f-who"))   it.who   = e.target.value;
  if(e.target.classList.contains("f-notes")){ it.notes = e.target.value; grow(e.target); }
  save();
});
$("rows").addEventListener("change", e => {
  if(!canEdit) return;
  const row = e.target.closest(".row"); if(!row) return;
  const it = doc.items[+row.dataset.i];
  if(e.target.classList.contains("f-dur")){ it.dur = parseDur(e.target.value); save(); render(); return; }
  if(e.target.classList.contains("f-day-date")){ it.date = e.target.value; save(); render(); return; }
  if(e.target.classList.contains("f-day-time")){ it.time = e.target.value.trim() || "09:00"; save(); render(); return; }
});
$("rows").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.classList.contains("f-dur")) e.target.blur();
});
document.addEventListener("keydown", e => {
  if(!canEdit && !canDrive) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.code === "Space" && !typing){ e.preventDefault(); goNext(); }
  if(e.key === "Escape" && !typing) stopShow();
});

$("btnGo").onclick = goNext;
$("btnStop").onclick = stopShow;
$("inStart").addEventListener("change", e => {
  doc.start = e.target.value.trim() || "10:00";
  setStartEpoch(doc.start); // re-anchor to this device's clock/zone, "today"
  save(); render();
});
$("chkNotes").addEventListener("change", e => {
  doc.shareNotes = e.target.checked;
  save(true);
  banner(e.target.checked
    ? "Notes are now visible to anyone with the viewer link."
    : "Notes are hidden from viewers again.", e.target.checked ? "warn" : "good");
});
$("btnRename").onclick = () => {
  const v = prompt("Rename rundown", name); if(v === null) return;
  name = v || name; $("showName").textContent = name; document.title = name + " — Rundown";
  save(true);
};
$("btnAddCue").onclick = () => { doc.items.push({ id:rid(), type:"cue", title:"", who:"", notes:"", dur:300 }); save(); render(); };
$("btnAddHead").onclick = () => { doc.items.push({ id:rid(), type:"heading", title:"New section" }); save(); render(); };
$("btnAddDay").onclick = () => {
  // Default the new day to the day after whatever the last day-break (or
  // the show's own start, if this is the first one) currently lands on, at
  // the same time of day — a reasonable guess for "workshop starts at the
  // same hour each morning" that the operator can just edit if it's wrong.
  let last = doc.startEpoch;
  for(const it of doc.items) if(it.type==="day") last = dayEpoch(it, last);
  const nd = new Date(last + 24*3600*1000);
  const pad = n => String(n).padStart(2,"0");
  const dayNum = doc.items.filter(i=>i.type==="day").length + 2; // day 1 is implicit
  doc.items.push({
    id: rid(), type: "day", title: "Day " + dayNum,
    date: `${nd.getFullYear()}-${pad(nd.getMonth()+1)}-${pad(nd.getDate())}`,
    time: doc.start || "09:00",
  });
  save(); render();
};
$("btnCopy").onclick = async () => {
  try{ await navigator.clipboard.writeText($("shareUrl").value); $("btnCopy").textContent="Copied"; setTimeout(()=>$("btnCopy").textContent="Copy",1400); }
  catch(e){ $("shareUrl").select(); }
};
$("btnCopyDrive").onclick = async () => {
  // This one carries a secret, unlike the viewer link — worth the reminder,
  // since it looks superficially similar when pasted.
  try{ await navigator.clipboard.writeText($("driveUrl").value); $("btnCopyDrive").textContent="Copied"; setTimeout(()=>$("btnCopyDrive").textContent="Copy",1400); }
  catch(e){ $("driveUrl").select(); }
};
$("btnCsv").onclick = () => {
  const starts = plannedStarts(doc), q = s => `"${String(s ?? "").replace(/"/g,'""')}"`;
  const lines = [["Start","Length","Type","Segment","Who","Notes"].join(",")];
  doc.items.forEach((it,i) => lines.push([
    q(fmtClock(starts[i])), q(it.type==="cue" ? fmtDur(it.dur||0) : ""),
    q(it.type), q(it.title||""), q(it.who||""), q(it.notes||"")
  ].join(",")));
  const url = URL.createObjectURL(new Blob([lines.join("\n")], {type:"text/csv"}));
  const a = document.createElement("a");
  a.href = url; a.download = name.replace(/[^\w -]/g,"") + ".csv"; a.click();
  URL.revokeObjectURL(url);
};

/* ---------- boot ---------- */
loadShow()
  .then(connect)
  .catch(e => { banner(e.message, "bad"); state("Failed"); });
</script>
